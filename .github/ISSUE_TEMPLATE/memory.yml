name: Memory usage
description: Report excessive memory use or a memory regression.
title: "[Memory]: "
body:
  - type: textarea
    id: field_1
    attributes:
      label: Workload, configuration, and hardware
    validations:
      required: true
  - type: textarea
    id: field_2
    attributes:
      label: Expected and observed memory usage
    validations:
      required: true
  - type: textarea
    id: field_3
    attributes:
      label: Reproduction and measurement method
