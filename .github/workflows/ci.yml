name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
    - run: echo 'Format job log' > "$RUNNER_TEMP/ci-log.txt"
    - uses: actions/checkout@v5
    - name: Install clang-format 23
      run: |
        exec > >(tee -a "$RUNNER_TEMP/ci-log.txt") 2>&1
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
          sudo tee /etc/apt/keyrings/llvm-snapshot.gpg.key > /dev/null
        echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg.key] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" |
          sudo tee /etc/apt/sources.list.d/llvm-23.list > /dev/null
        sudo apt-get update
        sudo apt-get install --yes clang-format-23
        sudo ln -sf /usr/bin/clang-format-23 /usr/local/bin/clang-format
        clang-format --version
    - name: Check project C++ formatting
      run: python3 scripts/python/format_cpp.py project --check 2>&1 | tee -a "$RUNNER_TEMP/ci-log.txt"
    - name: Upload format log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: format-log
        path: ${{ runner.temp }}/ci-log.txt
        if-no-files-found: warn
        retention-days: 7

  linux-debug:
    needs: format
    runs-on: ubuntu-24.04
    steps:
    - run: echo 'Linux Debug build log' > "$RUNNER_TEMP/ci-log.txt"
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTEXASSOLVER_BUILD_TESTS=ON 2>&1 | tee -a "$RUNNER_TEMP/ci-log.txt"
    - run: cmake --build build --config Debug --parallel 2>&1 | tee -a "$RUNNER_TEMP/ci-log.txt"
    - name: Archive Linux Debug build
      run: tar --create --gzip --file linux-debug-build.tar.gz build 2>&1 | tee -a "$RUNNER_TEMP/ci-log.txt"
    - uses: actions/upload-artifact@v6
      with:
        name: linux-debug-build
        path: linux-debug-build.tar.gz
        if-no-files-found: error
        retention-days: 1
    - name: Upload Linux Debug build log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: linux-debug-log
        path: ${{ runner.temp }}/ci-log.txt
        if-no-files-found: warn
        retention-days: 7

  linux-debug-ctest:
    needs: linux-debug
    runs-on: ubuntu-24.04
    steps:
    - run: echo 'Linux Debug CTest log' > "$RUNNER_TEMP/ci-log.txt"
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - uses: actions/download-artifact@v7
      with:
        name: linux-debug-build
        path: artifacts
    - run: tar --extract --gzip --file artifacts/linux-debug-build.tar.gz 2>&1 | tee -a "$RUNNER_TEMP/ci-log.txt"
    - run: ctest --test-dir build -C Debug --output-on-failure --no-tests=error 2>&1 | tee -a "$RUNNER_TEMP/ci-log.txt"
    - name: Upload Linux Debug CTest log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: linux-debug-ctest-log
        path: ${{ runner.temp }}/ci-log.txt
        if-no-files-found: warn
        retention-days: 7

  linux-release:
    needs: linux-debug-ctest
    runs-on: ubuntu-24.04
    steps:
    - run: echo 'Linux Release build log' > "$RUNNER_TEMP/ci-log.txt"
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTEXASSOLVER_BUILD_TESTS=ON 2>&1 | tee -a "$RUNNER_TEMP/ci-log.txt"
    - run: cmake --build build --config Release --parallel 2>&1 | tee -a "$RUNNER_TEMP/ci-log.txt"
    - name: Upload Linux Release build log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: linux-release-log
        path: ${{ runner.temp }}/ci-log.txt
        if-no-files-found: warn
        retention-days: 7

  windows-release:
    needs: linux-release
    runs-on: windows-2022
    steps:
    - run: echo 'Windows Release build log' > "$RUNNER_TEMP/ci-log.txt"
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTEXASSOLVER_BUILD_TESTS=ON 2>&1 | tee -a "$RUNNER_TEMP/ci-log.txt"
    - run: cmake --build build --config Release --parallel 2>&1 | tee -a "$RUNNER_TEMP/ci-log.txt"
    - name: Upload Windows Release build log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: windows-release-log
        path: ${{ runner.temp }}/ci-log.txt
        if-no-files-found: warn
        retention-days: 7

  windows-debug:
    needs: linux-release
    runs-on: windows-2022
    steps:
    - run: echo 'Windows Debug build log' > "$RUNNER_TEMP/ci-log.txt"
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTEXASSOLVER_BUILD_TESTS=ON 2>&1 | tee -a "$RUNNER_TEMP/ci-log.txt"
    - run: cmake --build build --config Debug --parallel 2>&1 | tee -a "$RUNNER_TEMP/ci-log.txt"
    - name: Upload Windows Debug build log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: windows-debug-log
        path: ${{ runner.temp }}/ci-log.txt
        if-no-files-found: warn
        retention-days: 7
