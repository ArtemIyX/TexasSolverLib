name: Apply C++ Format

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: ${{ github.ref }}
    - run: sudo apt-get update && sudo apt-get install --yes clang-format
    - run: python3 scripts/python/format_cpp.py project
    - name: Commit formatting changes
      run: |
        git diff --quiet && exit 0
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- '*.h' '*.hpp' '*.cpp'
        git commit -m "ci: apply clang-format"
        git push
