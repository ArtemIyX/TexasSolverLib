name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
    - run: cmake --build build -j
    - run: ctest --test-dir build --output-on-failure