name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install clang-format 23
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
          sudo tee /etc/apt/keyrings/llvm-snapshot.gpg.key > /dev/null
        echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg.key] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" |
          sudo tee /etc/apt/sources.list.d/llvm-23.list > /dev/null
        sudo apt-get update
        sudo apt-get install --yes clang-format-23
        sudo ln -sf /usr/bin/clang-format-23 /usr/local/bin/clang-format
        clang-format --version
    - name: Check changed C++ files
      shell: bash
      run: |
        if [ -z "$BASE_SHA" ] || printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
          exit 0
        fi
        git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.h' '*.hpp' '*.cpp' |
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              external/*)
                echo "Skipping clang-format for vendored file: $path"
                ;;
              *)
                python3 scripts/python/format_cpp.py file "$path" --check
                ;;
            esac
          done

  build:
    needs: format
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DTEXASSOLVER_BUILD_TESTS=ON
    - run: cmake --build build --config ${{ matrix.build_type }} --parallel
    - name: Archive Ubuntu Debug build
      if: matrix.os == 'ubuntu-24.04' && matrix.build_type == 'Debug'
      run: tar --create --gzip --file linux-debug-build.tar.gz build
    - uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-24.04' && matrix.build_type == 'Debug'
      with:
        name: linux-debug-build
        path: linux-debug-build.tar.gz
        if-no-files-found: error
        retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/download-artifact@v4
      with:
        name: linux-debug-build
        path: artifacts
    - run: tar --extract --gzip --file artifacts/linux-debug-build.tar.gz
    - run: ctest --test-dir build -C Debug --output-on-failure --no-tests=error
