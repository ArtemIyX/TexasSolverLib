name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DTEXASSOLVER_BUILD_TESTS=ON
    - run: cmake --build build --config ${{ matrix.build_type }} --parallel
    - run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --no-tests=error
