name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update && sudo apt-get install --yes clang-format
    - name: Check changed C++ files
      shell: bash
      run: |
        if [ -z "$BASE_SHA" ] || printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
          exit 0
        fi
        git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.h' '*.hpp' '*.cpp' |
          while IFS= read -r path; do
            [ -z "$path" ] || python3 scripts/python/format_cpp.py file "$path" --check
          done

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DTEXASSOLVER_BUILD_TESTS=ON
    - run: cmake --build build --config ${{ matrix.build_type }} --parallel
    - run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --no-tests=error
